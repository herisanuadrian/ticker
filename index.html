<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticker</title>
<style>
  body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #111; color: #eee; }
  main { text-align: center; padding: 1rem; }
  label { display: block; margin-bottom: .5rem; color: #aaa; }
  input { font-size: 1.5rem; width: 6ch; text-align: center; padding: .3rem; border-radius: 6px; border: 1px solid #444; background: #222; color: #eee; }
  button { font-size: 1.2rem; padding: .6rem 1.6rem; margin-top: 1rem; border: 0; border-radius: 6px; background: #3b82f6; color: #fff; cursor: pointer; }
  #remaining { font-size: 3rem; font-variant-numeric: tabular-nums; margin-top: 1rem; }
  #dot { width: 20px; height: 20px; border-radius: 50%; background: #333; margin: 1rem auto 0; }
  #dot.on { background: #3b82f6; }
</style>
</head>
<body>
<main>
  <label for="time">Duration (min:sec)</label>
  <input id="time" value="1:00" inputmode="numeric" placeholder="m:ss">
  <div><button id="btn">Start</button></div>
  <div id="remaining">1:00</div>
  <div id="dot"></div>
</main>
<script>
const INTERVAL = 2; // seconds between ticks
const $ = id => document.getElementById(id);
let ctx, timer, startAt, endAt, nextTick, running = false;

function parse(s) {
  const m = s.trim().match(/^(\d+)(?::(\d{1,2}))?$/);
  if (!m) return null;
  const total = m[2] === undefined ? +m[1] * 60 : +m[1] * 60 + +m[2];
  return total > 0 ? total : null;
}
const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;

function tick(when) {
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.frequency.value = 1000;
  gain.gain.setValueAtTime(0.0001, when);
  gain.gain.exponentialRampToValueAtTime(0.6, when + 0.002);
  gain.gain.exponentialRampToValueAtTime(0.0001, when + 0.06);
  osc.connect(gain).connect(ctx.destination);
  osc.start(when);
  osc.stop(when + 0.07);
  setTimeout(() => { $('dot').classList.add('on'); setTimeout(() => $('dot').classList.remove('on'), 100); },
    Math.max(0, (when - ctx.currentTime) * 1000));
}

function loop() {
  // schedule ticks slightly ahead for accurate timing
  while (nextTick < ctx.currentTime + 0.3 && nextTick < endAt) {
    tick(nextTick);
    nextTick += INTERVAL;
  }
  const left = Math.max(0, endAt - ctx.currentTime);
  $('remaining').textContent = fmt(Math.ceil(left));
  if (left <= 0) stop();
}

function start() {
  const secs = parse($('time').value);
  if (!secs) { $('time').focus(); return; }
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  ctx.resume();
  startAt = nextTick = ctx.currentTime + 0.05;
  endAt = startAt + secs;
  running = true;
  $('btn').textContent = 'Stop';
  timer = setInterval(loop, 50);
  loop();
}

function stop() {
  clearInterval(timer);
  running = false;
  $('btn').textContent = 'Start';
  const secs = parse($('time').value);
  $('remaining').textContent = secs ? fmt(secs) : '0:00';
}

$('btn').onclick = () => running ? stop() : start();
$('time').oninput = () => { if (!running) { const s = parse($('time').value); if (s) $('remaining').textContent = fmt(s); } };
</script>
</body>
</html>
